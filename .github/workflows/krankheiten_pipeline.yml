name: Krankheiten-Pipeline

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Max. Anzahl Eintraege (0 = alle)'
        required: false
        default: '0'
      kategorie:
        description: 'Nur eine Kategorie (leer = alle)'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run (true = nur simulieren)'
        required: false
        default: 'false'

jobs:
  fill-krankheiten:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipelines/requirements.txt

      - name: Abhaengigkeiten installieren
        run: pip install -r pipelines/requirements.txt supabase

      - name: Pipeline ausfuehren
        env:
          CLAUDE_API_KEY:       ${{ secrets.CLAUDE_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.count }}" != "0" ] && [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="$ARGS --count ${{ github.event.inputs.count }}"
          fi
          if [ -n "${{ github.event.inputs.kategorie }}" ]; then
            ARGS="$ARGS --kategorie '${{ github.event.inputs.kategorie }}'"
          fi
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python pipelines/krankheiten_pipeline.py $ARGS

      - name: Ergebnis zusammenfassen
        if: always()
        run: echo "Pipeline abgeschlossen. Details im Log oben."

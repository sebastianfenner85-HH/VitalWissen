name: Supabase Keepalive

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health (kein Secret noetig)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ejyrzxmtosrouwstiyws.supabase.co/auth/v1/health")
          echo "Auth health HTTP: ${STATUS}"
          if [ "${STATUS}" != "200" ] && [ "${STATUS}" != "401" ]; then
            echo "Auth health: unerwarteter Status ${STATUS}"
            exit 1
          fi
          echo "Auth health OK (HTTP ${STATUS} -- 200=public/401=auth-required, beides akzeptiert)"

      - name: Ping Supabase REST (read-only, anon)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "https://ejyrzxmtosrouwstiyws.supabase.co/rest/v1/laborwerte?select=loinc_code&limit=1")
          echo "REST HTTP: ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "REST: unerwarteter Status ${STATUS}"
            exit 1
          fi
          echo "Keepalive erfolgreich -- Supabase aktiv"

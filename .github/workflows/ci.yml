name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-safety:
    name: Build and safety gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Git diff whitespace check
        run: git diff --check

      - name: List changed text files
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${BASE_REF:-}" ]; then
            git diff --name-only --diff-filter=ACMRT "origin/${BASE_REF}...HEAD" > changed-files.txt
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$GITHUB_SHA" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi
          cat changed-files.txt

      - name: Text safety scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          suffixes = {
              '.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs',
              '.yml', '.yaml', '.md', '.css', '.html', '.json', '.toml'
          }
          forbidden_unicode = {
              'U+2028': '\u2028',
              'U+2029': '\u2029',
              'U+202A': '\u202a',
              'U+202B': '\u202b',
              'U+202C': '\u202c',
              'U+202D': '\u202d',
              'U+202E': '\u202e',
              'U+2066': '\u2066',
              'U+2067': '\u2067',
              'U+2068': '\u2068',
              'U+2069': '\u2069',
          }

          changed_file_list = Path('changed-files.txt')
          if not changed_file_list.exists():
              print('changed-files.txt missing')
              sys.exit(1)

          failures = []
          scanned = 0
          skipped = 0

          for raw in changed_file_list.read_text(encoding='utf-8').splitlines():
              path = Path(raw.strip())
              if not raw.strip() or not path.exists() or not path.is_file():
                  skipped += 1
                  continue
              if path.suffix.lower() not in suffixes:
                  skipped += 1
                  continue

              data = path.read_bytes()
              scanned += 1
              if data.startswith(b'\xef\xbb\xbf'):
                  failures.append(f'{path}: BOM U+FEFF')
              if b'\r\n' in data:
                  failures.append(f'{path}: CRLF line endings')

              text = data.decode('utf-8', errors='replace')
              for label, char in forbidden_unicode.items():
                  if char in text:
                      failures.append(f'{path}: forbidden {label}')

          print(f'Text safety scanned changed text files: {scanned}')
          print(f'Text safety skipped files: {skipped}')
          if failures:
              print('Text safety failures:')
              for item in failures:
                  print(f'- {item}')
              sys.exit(1)
          print('Text safety PASS')
          PY

  lint-advisory:
    name: Lint advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint advisory only
        run: |
          set +e
          npm run lint
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::npm run lint failed. Existing lint debt is tracked separately and is not a merge gate yet."
          fi
          exit 0

name: VitalWissen Healthcheck

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run healthcheck
        env:
          VITALWISSEN_SUPABASE_URL: ${{ vars.VITALWISSEN_SUPABASE_URL }}
          VITALWISSEN_SUPABASE_ANON_KEY: ${{ secrets.VITALWISSEN_SUPABASE_ANON_KEY }}
          VITALWISSEN_SITE_URL: ${{ vars.VITALWISSEN_SITE_URL }}
        run: node scripts/healthcheck-vitalwissen.mjs

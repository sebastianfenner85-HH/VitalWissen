# Supabase Data API Grants — Pflicht-Abschnitt ab VW-OPS-SUPABASE-GRANTS-01
# Für alle Pakete, die neue Supabase-public-Tabellen anlegen oder Schema-Migrationen durchführen.
# Bei reinen Docs-/Workspace-/QA-Paketen ohne DB-Berührung: explicit_data_api_grants_checked: not_applicable
supabase_grants:
  explicit_data_api_grants_checked: false  # true | false | not_applicable
  # true = alle neuen Tabellen haben GRANT SELECT TO anon + authenticated dokumentiert
  # false = BLOCKED — Paket darf nicht als abgeschlossen gelten
  # not_applicable = kein DB-Schema-Touch in diesem Paket
  new_tables: []       # Liste neuer Tabellen in diesem Paket
  grant_type: ""       # public_read | private_internal | s9_personal_data | not_applicable
  rls_enabled: false   # true wenn ALTER TABLE ... ENABLE ROW LEVEL SECURITY in Migration
  policy_created: false # true wenn CREATE POLICY in Migration
  smoke_test_done: false # true wenn anon SELECT-Check nach Migration durchgeführt
  notes: ""
# Pflicht-Referenz: 01_PROJECT_SOURCES_CURRENT/SUPABASE_DATA_API_GRANTS_FREEZE.md
# Template öffentlich: 04_OPS_SQL/supabase_public_read_table_template.sql
# Template privat:     04_OPS_SQL/supabase_private_table_template.sql
# Audit-Skript:        04_OPS_SQL/supabase_data_api_grants_audit.sql
# Keine neue public-Tabelle ohne explicit_data_api_grants_checked: true.

# Validatoren (optionale manuelle Checks nach Abschluss)
validators: []
# Beispiel:
# - id: V1
#   check: "Exportordner existiert mit allen required_outputs"
# - id: V2
#   check: "workspace_guard PASS oder PASS_WITH_WARNINGS"
